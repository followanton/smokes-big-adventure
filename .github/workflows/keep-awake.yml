# The free Supabase server for names and friends sleeps after 7 quiet days; a small call every 3 days keeps it awake.
name: Keep the friends server awake
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: >
          curl -sf -X POST https://oexrhihwepqevxgryycl.supabase.co/rest/v1/rpc/my_friends
          -H "apikey: sb_publishable_QbB8xbOtI0ZuZwbVJ_sAtg_sdLYcLBU"
          -H "Content-Type: application/json" -d '{"p_secret":"keep-awake"}'
