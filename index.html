<script>
// The loading bar creeps towards 95% while the 3D engine downloads and the city is built; the game sets 100% when it is ready.
(() => {
  const start = performance.now();
  const tick = () => {
    if (!document.getElementById('loading') || window.gameReady) return;
    const s = (performance.now() - start) / 1000, p = Math.round(95 * (1 - Math.exp(-s / 3)));
    document.getElementById('loadFill').style.width = p + '%';
    document.getElementById('loadText').textContent = s > 25 ? 'Het duurt lang... Ververs de pagina of check je internet.' : `Laden... ${p}%`;
    setTimeout(tick, 200);
  };
  tick();
})();
</script>

  const env = new THREE.Scene();

  room.position.y = 5;
  env.add(room);
  const strip = (color, power, x, y, z, w, h) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(power), side: THREE.DoubleSide }));

function cleanCopy(o, matrix) {

  g.clearGroups();

}
function glueByMaterial(list, parent) {

  for (const [o, matrix] of list) {
    if (!byMat.has(o.material)) byMat.set(o.material, []);
    byMat.get(o.material).push(cleanCopy(o, matrix));
  }
  for (const [material, geos] of byMat) {
    const m = new THREE.Mesh(mergeGeometries(geos), material);
    m.castShadow = !material.userData.noShadow;
    m.receiveShadow = true;
    m.userData.merged = true;

const RAIN_N = 6000;
const rainGeo = new THREE.BufferGeometry();
{
  const p = new Float32Array(RAIN_N * 6), tip = new Float32Array(RAIN_N * 2);

// Smoke is a grey-brown tabby kitten: dark stripes, white chest, white
// muzzle with a white stripe up the nose, white paws, pink nose, green-gold eyes.
function tabbyTexture(stripes, across, width = 1) {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const x = c.getContext('2d');
  x.fillStyle = '#b3a795';
  x.fillRect(0, 0, 128, 128);
  for (let i = 0; i < 1400; i++) {                  // fur speckles
    x.fillStyle = Math.random() < 0.5 ? 'rgba(200,190,170,.35)' : 'rgba(40,36,32,.3)';
    x.fillRect(Math.random() * 128, Math.random() * 128, 1, 2);
  }
  x.strokeStyle = 'rgba(45,39,33,.85)';
  x.lineCap = 'round';
  for (let i = 0; i < stripes; i++) {               // wavy tabby stripes
    const p = (i + 0.5) * 128 / stripes + rand(-3, 3), wob = rand(2, 5), ph = rand(0, 6);
    x.lineWidth = rand(4, 7) * width;
    x.beginPath();
    for (let t = 0; t <= 128; t += 4) {
      const q = p + Math.sin(t / 128 * Math.PI * 4 + ph) * wob;
      if (across) { if (t === 0) x.moveTo(q, t); else x.lineTo(q, t); }
      else { if (t === 0) x.moveTo(t, q); else x.lineTo(t, q); }
    }
    x.stroke();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}
function makeCat() {

  const fur = (stripes, across = false, width = 1) => new THREE.MeshPhysicalMaterial({ map: tabbyTexture(stripes, across, width), roughness: 1, sheen: 1, sheenRoughness: 0.45, sheenColor: new THREE.Color(0xffe9d6) });

  const white = new THREE.MeshPhysicalMaterial({ color: 0xf4f1ec, roughness: 1, sheen: 1, sheenRoughness: 0.4, sheenColor: new THREE.Color(0xffffff) });
  const pink = mat(0xf09aa8, { roughness: 0.6 }), innerEar = mat(0xe8b4bc, { roughness: 1 });
  const dark = mat(0x2a2622, { roughness: 1 }), black = mat(0x050505, { roughness: 0.15 });
  const eye = new THREE.MeshPhysicalMaterial({ color: 0xa8b85a, emissive: 0x9bc04a, emissiveIntensity: 0.4, roughness: 0.05, clearcoat: 1 });
  const shine = new THREE.MeshBasicMaterial({ color: new THREE.Color(3, 3, 3) });
  const blob = (r, m, x, y, z, sx = 1, sy = 1, sz = 1) => { const b = mesh(new THREE.SphereGeometry(r, 28, 20), m, x, y, z); b.scale.set(sx, sy, sz); return b; };

  const body = mesh(new THREE.CapsuleGeometry(0.3, 0.7, 10, 24), bodyFur, 0, 0.58, 0);
  body.rotation.x = Math.PI / 2;
  rig.add(body);
  rig.add(blob(0.3, white, 0, 0.42, 0.05, 0.85, 0.55, 1.6));
  rig.add(blob(0.2, white, 0, 0.7, 0.45, 1, 1.25, 0.8));
  rig.add(blob(0.27, bodyFur, 0, 0.6, -0.42, 1, 0.95, 0.9));      // round haunches

  // head: a big kitten head
  const head = new THREE.Group();
  head.position.set(0, 0.96, 0.58);

  skull.scale.set(1, 0.92, 0.95);

  glueChildren(head);

  const collar = mesh(new THREE.TorusGeometry(0.23, 0.03, 12, 32), glow(0x36e7ff, 2.5), 0, 0.8, 0.42);

  const legs = [], claws = [], clawMat = glow(0xdffcff, 2.2);
  for (const [x, z] of [[-0.16, 0.32], [0.16, 0.32], [-0.16, -0.3], [0.16, -0.3]]) {
    const pivot = new THREE.Group();
    pivot.position.set(x, 0.45, z);
    pivot.add(mesh(new THREE.CapsuleGeometry(0.072, 0.13, 6, 14), legFur, 0, -0.1, 0));
    const knee = new THREE.Group();
    knee.position.y = -0.21;
    knee.add(mesh(new THREE.CapsuleGeometry(0.064, 0.12, 6, 14), legFur, 0, -0.08, 0));
    knee.add(blob(0.09, white, 0, -0.21, 0.03, 1, 0.65, 1.3));
    pivot.add(knee);
    glueChildren(pivot);
    glueChildren(knee);
    if (claws.length < 2) {                                         // front paws have claws that pop out to slash
      const cl = new THREE.Group();
      for (const cx of [-0.045, 0, 0.045]) cl.add(mesh(new THREE.ConeGeometry(0.014, 0.09, 6).rotateX(Math.PI / 2), clawMat, cx, -0.21, 0.17));

    }

    legs.push(pivot);
    rig.add(pivot);
  }
  // a curly tail in 7 parts, so it can bend and sway
  const tail = new THREE.Group();
  tail.position.set(0, 0.7, -0.52);
  rig.add(tail);
  const tailSegs = [];
  let parent = tail;
  for (let i = 0; i < 7; i++) {
    const seg = new THREE.Group();
    if (i) seg.position.y = 0.13;
    const r0 = 0.068 - i * 0.006, r1 = r0 - 0.006;

  }
  glueChildren(rig);

  const lamp = new THREE.PointLight(0xffe6c8, 3, 5, 1.6);
  lamp.position.set(0, 2.2, 1.4);
  g.add(lamp);
  g.userData = { legs, head, rig, ears, eyes, tailSegs, claws };
  return g;
}

// The claw slash: a glowing streak with three claw marks that follows the swiping paw and fades behind it
const TRAIL_N = 24, TRAIL_LIFE = 0.22;
const trailTex = (() => {
  const [c, x] = makeCanvas(128, 64);       // left of the picture = right at the paw, right = the fading tail
  const fadeOut = (a, b) => { const g = x.createLinearGradient(0, 0, 128, 0); g.addColorStop(0, a); g.addColorStop(1, b); return g; };
  x.fillStyle = fadeOut('rgba(127,246,255,.3)', 'rgba(127,246,255,0)');
  x.fillRect(0, 0, 128, 64);
  for (const y of [12, 32, 52]) { x.fillStyle = fadeOut('rgba(255,255,255,1)', 'rgba(127,246,255,0)'); x.fillRect(0, y - 4, 128, 8); }
  return toTex(c);
})();
const trailGeo = new THREE.BufferGeometry();
trailGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(TRAIL_N * 6), 3));
trailGeo.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(TRAIL_N * 4), 2));
trailGeo.setIndex(Array.from({ length: TRAIL_N - 1 }, (_, i) => [i * 2, i * 2 + 1, i * 2 + 2, i * 2 + 1, i * 2 + 3, i * 2 + 2]).flat());
const trailMesh = new THREE.Mesh(trailGeo, new THREE.MeshBasicMaterial({ map: trailTex, color: new THREE.Color(1.1, 1.1, 1.1), transparent: true, opacity: 0.8, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false }));
trailMesh.frustumCulled = false;
trailMesh.visible = false;
scene.add(trailMesh);
const trailPts = [], tipA = new THREE.Vector3(), tipB = new THREE.Vector3(), tipM = new THREE.Vector3();
function updateTrail() {
  // while the paw swipes, remember where its claws are, a little wider than the claws themselves
  const sp = cat.slashT > 0 ? 1 - cat.slashT / SLASH_T : -1, paw = catObj.userData.claws.find(c => c.visible);
  if (paw && sp > 0.15 && sp < 0.75) {
    catObj.updateMatrixWorld(true);
    paw.localToWorld(tipA.set(-0.045, -0.21, 0.22));
    paw.localToWorld(tipB.set(0.045, -0.21, 0.22));
    tipM.addVectors(tipA, tipB).multiplyScalar(0.5);
    trailPts.unshift({ a: tipM.clone().lerp(tipA, 4.5), b: tipM.clone().lerp(tipB, 4.5), t: now });
  }
  while (trailPts.length > TRAIL_N || (trailPts.length && now - trailPts[trailPts.length - 1].t > TRAIL_LIFE)) trailPts.pop();
  trailMesh.visible = trailPts.length > 1;
  if (!trailMesh.visible) return;
  const pos = trailGeo.attributes.position.array, uv = trailGeo.attributes.uv.array;
  trailPts.forEach((p, i) => {
    const u = Math.min(1, (now - p.t) / TRAIL_LIFE);    // older points fade out
    pos.set([p.a.x, p.a.y, p.a.z, p.b.x, p.b.y, p.b.z], i * 6);
    uv.set([u, 0, u, 1], i * 4);
  });
  trailGeo.attributes.position.needsUpdate = true;
  trailGeo.attributes.uv.needsUpdate = true;
  trailGeo.setDrawRange(0, (trailPts.length - 1) * 6);
}

function freeSpot(r, { gap = 1, awayFrom = [], tries = 400, near = null } = {}) {
  for (let i = 0; i < tries; i++) {
    const x = near ? near.x + rand(-near.d, near.d) : rand(-W + 3, W - 3);
    const z = near ? near.z + rand(-near.d, near.d) : rand(-W + 3, W - 3);
    if (Math.abs(x) > W - 2 || Math.abs(z) > W - 2) continue;
    if (Math.hypot(x - START.x, z - START.z) < 8) continue;
    if (awayFrom.some(a => Math.hypot(x - a.x, z - a.z) < a.d)) continue;
    if (buildings.some(b => insideRect(x, z, b, r + gap))) continue;
    if (crates.some(c => insideRect(x, z, c, r + gap))) continue;
    if ([...bushes, ...gens].some(o => Math.hypot(x - o.x, z - o.z) < o.r + r + gap)) continue;
    if (beacon && Math.hypot(x - beacon.x, z - beacon.z) < 4 + r) continue;
    return { x, z };
  }
  return null;
}

// A box whose walls show windows at the right size: tileW x tileH world units per picture.
// Roofs use the dark corner of the picture.
function facadeBox(w, h, d, material, tileW, tileH, shop = false) {
  const geo = new THREE.BoxGeometry(w, h, d), uv = geo.attributes.uv;
  const ou = Math.floor(Math.random() * 4) / 4, ov = shop ? 0 : Math.floor(Math.random() * 8) / 8;
  for (let i = 0; i < 24; i++) {
    const f = i >> 2;
    if (f === 2 || f === 3) { uv.setXY(i, 0.004, shop ? 0.01 : 0.996); continue; }
    uv.setXY(i, uv.getX(i) * (f < 2 ? d : w) / tileW + ou, shop ? uv.getY(i) : uv.getY(i) * h / tileH + ov);
  }
  return new THREE.Mesh(geo, material);
}
// a box with its picture repeated every `tile` units (pavement)
function tiledBox(w, h, d, tile) {
  const geo = new THREE.BoxGeometry(w, h, d), uv = geo.attributes.uv;
  const dims = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];
  for (let i = 0; i < 24; i++) { const [a, b] = dims[i >> 2]; uv.setXY(i, uv.getX(i) * a / tile, uv.getY(i) * b / tile); }
  return geo;
}

    addStatic(plane, ...onWall(rand(-along + sw / 2, along - sw / 2) * 0.5, rand(3.8, Math.min(h - 1.5, 8)), 0.08));
  } else if (h > 14) {
    const bw = Math.min(along * 1.6, 7.5), bh = bw / 2;
    const [px, py, pz] = onWall(0, rand(h * 0.45, h - bh / 2 - 1), 0.12);
    addStatic(new THREE.Mesh(rbox(fz ? bw + 0.4 : 0.16, bh + 0.4, fz ? 0.16 : bw + 0.4, 0.05), M.black), px - fx * 0.05, py, pz - fz * 0.05);
    const plane = new THREE.Mesh(new THREE.PlaneGeometry(bw, bh), pick(BOARDS));
    plane.rotation.y = ry;
    addStatic(plane, px + fx * 0.04, py, pz + fz * 0.04);
  }
  buildings.push({ x, z, hx, hz, h });
}

// street lamp: pole, arm, glowing head, a soft cone of light and a pool of light on the street
const coneGeo = new THREE.CylinderGeometry(0.3, 2.3, 5, 28, 1, true), poolGeo = new THREE.CircleGeometry(2.6, 32);
function makeLamp(x, z) {
  const color = pick(NEON);
  addStatic(new THREE.Mesh(cyl(0.08, 0.12, 5.2, 10), M.pole), x, 2.6, z);
  addStatic(new THREE.Mesh(rbox(1.6, 0.1, 0.12, 0.04), M.pole), x - 0.7, 5.15, z);
  addStatic(new THREE.Mesh(rbox(0.7, 0.14, 0.34, 0.06), glowShared(color, 5)), x - 1.3, 5.04, z);
  addStatic(new THREE.Mesh(coneGeo, additiveShared('cone' + color, color, 0.04, 1.4, beamTex)), x - 1.3, 2.5, z);
  const pool = new THREE.Mesh(poolGeo, additiveShared('pool' + color, color, 0.22, 1.3, softTex));
  pool.rotation.x = -Math.PI / 2;
  addStatic(pool, x - 1.3, 0.035, z);
  lampSpots.push({ x: x - 1.3, z, color });
}

// steam rising from a drain in the street
const steamMat = new THREE.PointsMaterial({ map: softTex, size: 2.6, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, vertexColors: true, color: 0x9a94d8 });
function makeVent(x, z) {
  addStatic(new THREE.Mesh(cyl(0.6, 0.6, 0.05, 24), M.metal), x, 0.03, z);
  const n = 24, geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
  geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
  const pts = new THREE.Points(geo, steamMat);
  pts.frustumCulled = false;
  pts.layers.set(1);
  pts.userData.merged = true;
  levelGroup.add(pts);
  vents.push({ x, z, geo, life: Array.from({ length: n }, () => Math.random()), drift: Array.from({ length: n }, () => [rand(-0.3, 0.3), rand(-0.3, 0.3)]) });
}
function updateVents(dt) {
  for (const v of vents) {
    const p = v.geo.attributes.position, c = v.geo.attributes.color;
    v.life.forEach((t, i) => {
      t = v.life[i] = (t + dt * 0.3) % 1;
      p.setXYZ(i, v.x + v.drift[i][0] * t * 5, 0.2 + t * 5, v.z + v.drift[i][1] * t * 5);
      const a = Math.sin(t * Math.PI) * 0.35;
      c.setXYZ(i, a, a, a);
    });
    p.needsUpdate = c.needsUpdate = true;
  }
}

function makeGenerator(x, z) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  g.add(mesh(new THREE.CylinderGeometry(1.1, 1.3, 0.6, 12), M.dark, 0, 0.3, 0));
  const core = mesh(new THREE.CylinderGeometry(0.45, 0.45, 2.4, 12), M.genCore, 0, 1.8, 0);
  g.add(core);
  g.add(mesh(new THREE.CylinderGeometry(0.8, 0.8, 0.3, 12), M.dark, 0, 3.1, 0));
  const rings = [];
  for (let i = 0; i < 2; i++) {
    const ring = mesh(new THREE.TorusGeometry(0.85, 0.06, 8, 24), M.genCore, 0, 1.2 + i * 1.2, 0);
    ring.rotation.x = Math.PI / 2;
    rings.push(ring);
    g.add(ring);
  }
  const c = document.createElement('canvas');
  c.width = 64; c.height = 8;
  const hpTex = new THREE.CanvasTexture(c);
  const hpSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: hpTex, depthTest: false }));
  hpSprite.scale.set(1.6, 0.18, 1);
  hpSprite.position.y = 3.8;
  hpSprite.visible = false;
  g.add(hpSprite);
  levelGroup.add(g);
  return { x, z, r: 1.2, hp: 4, maxHp: 4, dead: false, obj: g, core, rings, hpSprite, hpCanvas: c, hpTex, flash: 0 };
}

function makeBeacon(x, z) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  const pad = new THREE.Mesh(new THREE.RingGeometry(1.2, 1.8, 32), new THREE.MeshBasicMaterial({ color: 0x36e7ff, transparent: true, opacity: 0.85 }));
  pad.rotation.x = -Math.PI / 2;
  pad.position.y = 0.05;
  g.add(pad);
  const beam = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 60, 24, 1, true),
    new THREE.MeshBasicMaterial({ color: 0x36e7ff, transparent: true, opacity: 0.2, depthWrite: false, side: THREE.DoubleSide, fog: false }));
  beam.position.y = 30;
  g.add(beam);
  levelGroup.add(g);
  return { x, z, pad, beam };
}

function buildLevel(ci) {
  const ch = CHAPTERS[ci];
  if (levelGroup) {
    scene.remove(levelGroup);
    for (const d of dogs) { levelGroup.remove(d.obj); disposeDog(d.obj); }
    for (const g of gens) { g.hpTex.dispose(); g.hpSprite.material.dispose(); }
    for (const b of bushes) b.material.dispose();
    // free every shape the old level used (a shape shared with other things just gets sent to the graphics card again)
    levelGroup.traverse(o => { if (o.isMesh) o.geometry.dispose(); });
  }
  levelGroup = new THREE.Group();
  scene.add(levelGroup);
  staticGroup = new THREE.Group();
  for (const b of bolts) scene.remove(b.obj);
  buildings = []; crates = []; bushes = []; fishes = []; gens = []; dogs = []; bolts = []; lampSpots = []; vents = []; overhangs = [];
  beacon = null; defeated = 0; gensDone = 0; reinforceTimer = ch.reinforce?.every ?? 0; playTime = 0; hintsShown = 0;

  // city blocks
  const goalCell = ch.goal === 'reach' ? { x: pick([-27, -9, 9, 27]), z: -45 } : null;
  for (const cx of CELLS) for (const cz of CELLS) {
    if (cz === 45 && Math.abs(cx) <= 9) continue;                         // starting street
    if (goalCell && cx === goalCell.x && cz === goalCell.z) continue;     // the goal plaza
    if (ch.arena && Math.abs(cx) <= 27 && Math.abs(cz) <= 27) continue;   // boss arena
    if (Math.random() < 0.22) continue;                                   // small plazas
    makeBuilding(cx + rand(-1.2, 1.2), cz + rand(-1.2, 1.2), rand(3.6, 5.8), rand(3.6, 5.8), rand(9, 32));
  }
  if (goalCell) beacon = makeBeacon(goalCell.x, goalCell.z);
  hideoutHatch = ci === 0 && beacon ? makeHatch(beacon.x, beacon.z) : null;     // the way down to Bolt's hideout

  // street lamps at the crossings
  for (const ix of [-36, -18, 0, 18, 36]) for (const iz of [-36, -18, 0, 18, 36]) {
    if (Math.random() < 0.35) continue;
    const x = ix + 1.6, z = iz + 1.6;
    if (buildings.some(b => insideRect(x, z, b, 0.5) || insideRect(x - 1.3, z, b, 0.5))) continue;
    makeLamp(x, z);
  }

  // crates Smoke can jump on
  for (let i = 0; i < (ch.arena ? 10 : 12); i++) {
    const p = freeSpot(1.2, { gap: 1.5 });
    if (!p) continue;
    addStatic(new THREE.Mesh(rbox(2, 1.2, 2, 0.08), crateMat), p.x, 0.6, p.z);
    addStatic(new THREE.Mesh(G.crateEdge, glowShared(pick(NEON), 2.5)), p.x, 1.2, p.z);
    crates.push({ ...p, hx: 1, hz: 1, top: 1.2 });
  }
  // holo-bushes to hide in: glowing see-through hologram plants with a projector ring
  for (let i = 0; i < 8; i++) {
    const p = freeSpot(1.7, { gap: 1.2 });
    if (!p) continue;
    const material = new THREE.MeshStandardMaterial({ color: 0x0f4a3c, emissive: 0x2bffb4, emissiveMap: holoTex, emissiveIntensity: 1.1, transparent: true, opacity: 0.82, flatShading: true, roughness: 0.3 });
    const g = new THREE.Group();
    for (const [x, y, z, s] of [[0, 0.8, 0, 1.2], [0.8, 0.6, 0.3, 0.9], [-0.7, 0.6, -0.3, 0.95], [0.1, 0.6, -0.8, 0.85], [-0.2, 0.6, 0.8, 0.85]]) {
      const b = mesh(G.bush, material, x, y, z);
      b.scale.setScalar(s);
      g.add(b);
    }
    glueChildren(g);
    g.position.set(p.x, 0, p.z);
    g.children[0].castShadow = false;
    levelGroup.add(g);
    const ring = new THREE.Mesh(new THREE.RingGeometry(1.75, 1.9, 48), additiveShared('bushring', 0x2bd99a, 0.6, 2));
    ring.rotation.x = -Math.PI / 2;
    addStatic(ring, p.x, 0.05, p.z);
    bushes.push({ ...p, r: 1.7, material });
  }
  // generators
  if (ch.goal === 'generators') {
    for (let i = 0; i < ch.count; i++) {
      const p = freeSpot(1.5, { gap: 2, awayFrom: [{ ...START, d: 30 }, ...gens.map(g => ({ x: g.x, z: g.z, d: 25 }))] }) || freeSpot(1.5, { gap: 2, awayFrom: [{ ...START, d: 25 }] });
      if (p) gens.push(makeGenerator(p.x, p.z));
    }
  }
  // fish snacks: each one heals a heart
  for (let i = 0; i < 5; i++) {
    let p, y = 0.7;
    if (i < 2 && crates[i]) { p = { x: crates[i].x, z: crates[i].z }; y = 1.9; }
    else p = freeSpot(0.6, { gap: 0.6 });
    if (!p) continue;
    const f = new THREE.Group();
    const body = mesh(G.fishBody, M.fish);
    body.scale.set(0.55, 0.8, 1.3);
    f.add(body);
    const tail = mesh(G.fishTail, M.fish, 0, 0, -0.5);
    tail.rotation.set(Math.PI / 2, Math.PI / 4, 0);
    f.add(tail);
    f.position.set(p.x, y, p.z);
    levelGroup.add(f);
    fishes.push({ x: p.x, z: p.z, y, obj: f, got: false });
  }
  // steam vents
  for (let i = 0; i < 6; i++) {
    const p = freeSpot(0.8, { gap: 0.5 });
    if (p) makeVent(p.x, p.z);
  }
  // robot dogs
  for (const [type, n] of Object.entries(ch.dogs)) {
    for (let i = 0; i < n; i++) {
      let p;
      if (type === 'boss') p = { x: 0, z: -10 };
      else if (type === 'tank' && gens.length) p = freeSpot(0.8, { near: { x: gens[i % gens.length].x, z: gens[i % gens.length].z, d: 6 } });
      p = p || freeSpot(0.8, { awayFrom: [{ ...START, d: 30 }] });
      if (p) spawnDog(type, p.x, p.z);
    }
  }

  paintStreets();
  bakeStatic();
  resetCat();
  updateHud();
}

function spawnDog(type, x, z) {
  const t = TYPES[type];
  const obj = makeRobotDog(t);
  obj.position.set(x, 0, z);
  levelGroup.add(obj);
  const d = {
    type, t, x, z, hp: t.hp, maxHp: t.hp, r: 0.5 * t.scale, heading: rand(0, 6), state: 'wander', tx: x, tz: z, timer: 0,
    lastX: x, lastZ: z, obj, phase: rand(0, 6), checkX: x, checkZ: z, checkT: 0, detour: 0, detourX: 0, detourZ: 0, speed: 0,
    kx: 0, kz: 0, stun: 0, flash: 0, biteCd: 0, shootCd: rand(1, 2.5), aim: 0, dead: false,
    bState: 'walk', bTimer: 3, bMoves: 0, chargeX: 0, chargeZ: 0, summoned: 0,
    flank: rand(-1, 1), retreat: 0, lastVX: 0, lastVZ: 0, sniffed: false,
  };
  drawHpBar(d);
  dogs.push(d);
  return d;
}

function resetCat() {
  Object.assign(cat, { x: START.x, z: START.z, y: 0, vx: 0, vz: 0, vy: 0, grounded: true, heading: Math.PI, stamina: 1, hidden: null, hp: MAX_HP, invuln: 1, slashCd: 0, kb: 0, nap: 0, climb: 0 });
  camYaw = 0;
}

const keys = {};
const held = action => settings.keys[action].some(c => keys[c]);
addEventListener('keydown', e => {
  if (rebinding) {                       // the settings screen is waiting for a new key
    e.preventDefault();
    if (e.code !== 'Escape') setKey(rebinding, e.code);
    rebinding = null;
    showSettings();
    return;
  }
  keys[e.code] = true;
  if (['Space', 'Tab', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  // Enter presses a screen's first button, but not just after the screen opens (so mashing keys can't skip it)
  if (e.code === 'Enter' && overlayButtons[0]) { e.preventDefault(); if (performance.now() - overlayOpenedAt > 500) overlayButtons[0](); return; }
  if (state === 'cutscene') {
    e.preventDefault();
    if (e.code === 'Escape') endScene();
    else if (e.code === 'Space' || e.code === 'Enter' || bound('slash', e.code) || bound('jump', e.code)) advanceScene();
    return;
  }
  if (state === 'map') { if (bound('map', e.code) || e.code === 'Escape' || bound('pause', e.code)) toggleMap(); return; }
  if (inSettings) { if (e.code === 'Escape') settingsBack(); return; }
  if (shopOpen) { if (e.code === 'Escape') closeShop(); return; }
  if ((bound('pause', e.code) || e.code === 'Escape') && (state === 'play' || state === 'paused')) togglePause();
  if (state !== 'play') return;
  if (bound('map', e.code)) toggleMap();
  if (performance.now() < inputLockUntil) return;     // keys mashed to get through a movie don't make Smoke jump
  if (bound('jump', e.code) && cat.grounded) { cat.vy = JUMP; cat.grounded = false; sfx.jump(); }
  if (bound('slash', e.code)) slash();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

let dragging = null, lastX = 0, lastY = 0, lastDrag = -10;    // dragging: the finger or mouse turning the camera
renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());
renderer.domElement.addEventListener('pointerdown', e => {
  dragging = e.pointerId; lastX = e.clientX; lastY = e.clientY;
  // a click slashes; on a touch screen the 🐾 button does, so a finger can turn the camera
  if (e.button === 0 && e.pointerType !== 'touch' && state === 'play' && performance.now() >= inputLockUntil) slash();
  if (state === 'cutscene') advanceScene();
});
addEventListener('pointerup', e => { if (e.pointerId === dragging) dragging = null; });
addEventListener('pointercancel', e => { if (e.pointerId === dragging) dragging = null; });
addEventListener('pointermove', e => {
  if (e.pointerId !== dragging) return;
  camYaw -= (e.clientX - lastX) * 0.006;
  lastDrag = now;
  camPitch = clamp(camPitch + (e.clientY - lastY) * 0.004, 0.15, 1.2);
  lastX = e.clientX; lastY = e.clientY;
});
addEventListener('wheel', e => { camDist = clamp(camDist + e.deltaY * 0.01, 4, 16); }, { passive: true });

const $ = id => document.getElementById(id);
let toastTimer = null;
function toast(text, ms = 1600) {
  const t = $('toast');
  t.textContent = text;
  t.style.opacity = 1;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.opacity = 0; }, ms);

function objectiveText() {

}
function updateHud() {

// ---- the outfit shop: Smoke shows off his hats up close ----
let shopOpen = false;
function openShop() {
  shopOpen = true;
  document.body.classList.add('shop');
  showShop();
}
function closeShop() {
  shopOpen = false;
  document.body.classList.remove('shop');
  showMenu();
}
function showShop() {
  const rows = [{ id: null, name: T.noHat, icon: '🐱', price: 0 }, ...OUTFITS].map(o => {
    const owned = !o.id || shop.owned.includes(o.id), wearing = shop.wearing === o.id;
    const button = wearing ? `<button class="wearing" data-wear="${o.id ?? ''}">${t('wearing')}</button>`
      : owned ? `<button data-wear="${o.id ?? ''}">${t('wear')}</button>`
      : shop.coins >= o.price ? `<button data-buy="${o.id}">${t('buy', coins(o.price))}</button>`
      : `<button disabled>${t('needMore', coins(o.price - shop.coins))}</button>`;
    return `<div class="shopRow"><span class="ico">${o.icon}</span><span class="nm">${say(o.name)}${o.price ? `<span class="pr">🪙 ${coins(o.price)}</span>` : ''}</span>${button}</div>`;
  }).join('');
  showOverlay(`<h2>${t('shopTitle')}</h2><div class="coinBig">${t('coins', coins(shop.coins))}</div>
    <p class="small">${t('shopNote')}</p>${rows}`, [{ text: t('back'), action: closeShop }]);
  $('card').querySelectorAll('button[data-buy]').forEach(b => {
    b.onclick = () => {
      const o = OUTFITS.find(x => x.id === b.dataset.buy);
      if (shop.coins < o.price || shop.owned.includes(o.id)) return;
      shop.coins -= o.price;
      shop.owned.push(o.id);
      shop.wearing = o.id;          // put it on straight away
      saveShop();
      wearOutfit(o.id);
      sfx.win();
      showShop();
    };
  });
  $('card').querySelectorAll('button[data-wear]').forEach(b => {
    b.onclick = () => {
      const id = b.dataset.wear || null;
      shop.wearing = shop.wearing === id ? null : id;     // click again to take it off
      saveShop();
      wearOutfit(shop.wearing);
      sfx.meow();
      showShop();
    };
  });
}
// in the shop the camera looks at Smoke from the front, and he turns his head to show off
function shopCamera(dt) {
  const base = Math.PI, c = Math.cos(base), sn = Math.sin(base);
  cat.heading = base + Math.sin(now * 0.7) * 0.7;
  catObj.position.set(cat.x, cat.y, cat.z);
  catObj.rotation.y = cat.heading;
  animateCat(dt, 0);
  camera.position.set(cat.x + sn * 3.4, cat.y + 1.35, cat.z + c * 3.4);
  camera.lookAt(cat.x - c * 1.0, cat.y + 0.95, cat.z + sn * 1.0);    // Smoke a little to the right, next to the list
}

}

// ---- Settings: music, sound effects and keys ----
let inSettings = false, settingsBack = showMenu, rebinding = null;
function openSettings(back) {
  inSettings = true;
  settingsBack = () => { inSettings = false; rebinding = null; back(); };
  showSettings();
}
function setKey(action, code) {
  const mine = settings.keys[action], old = mine[0];
  // if another action already uses this key, it gets this action's old key instead
  for (const [id] of ACTIONS) {
    const list = settings.keys[id];
    if (id === action || !list.includes(code)) continue;
    settings.keys[id] = [...new Set(list.map(c => c === code ? old : c))];
  }
  settings.keys[action] = [...new Set([code, ...mine.slice(1)])];
  saveSettings();
  toast(`${say(ACTIONS.find(a => a[0] === action)[1])}: ${keyName(code)}`, 1000);
}
function showSettings() {

// ---- Touch controls: the stick and buttons press the same keys a keyboard would ----
if (touchScreen) {
  document.body.classList.add('touch');
  const press = (code, down) => dispatchEvent(new KeyboardEvent(down ? 'keydown' : 'keyup', { code }));
  const keyOf = act => act === 'pause' ? 'Escape' : settings.keys[act][0];
  for (const b of document.querySelectorAll('#touch button')) {
    const up = () => press(keyOf(b.dataset.act), false);
    b.addEventListener('pointerdown', e => { e.preventDefault(); b.setPointerCapture(e.pointerId); press(keyOf(b.dataset.act), true); });
    b.addEventListener('pointerup', up);
    b.addEventListener('pointercancel', up);
  }
  // the stick appears under your thumb anywhere on the left, and steers in 8 directions
  const zone = $('stickZone'), stick = $('stick'), knob = $('knob'), held = {};
  let finger = null, sx = 0, sy = 0;
  const steer = (act, on) => { if (!!held[act] !== on) { held[act] = on; press(settings.keys[act][0], on); } };
  const release = e => {
    if (e.pointerId !== finger) return;
    finger = null;
    for (const act of ['forward', 'back', 'left', 'right']) steer(act, false);
    stick.classList.remove('on'); stick.style.left = stick.style.top = ''; knob.style.transform = '';
  };
  zone.addEventListener('pointerdown', e => {
    if (finger !== null) return;
    finger = e.pointerId; sx = e.clientX; sy = e.clientY;
    zone.setPointerCapture(e.pointerId);
    stick.classList.add('on'); stick.style.left = `${sx}px`; stick.style.top = `${sy}px`;
  });
  zone.addEventListener('pointermove', e => {
    if (e.pointerId !== finger) return;
    let dx = e.clientX - sx, dy = e.clientY - sy;
    const d = Math.hypot(dx, dy), R = 50;
    if (d > R) { dx *= R / d; dy *= R / d; }
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
    const on = d > 12, c = dx / (d || 1), s = dy / (d || 1);    // 0.38 = sin(22.5°): 8 slices
    steer('right', on && c > 0.38); steer('left', on && c < -0.38);
    steer('back', on && s > 0.38); steer('forward', on && s < -0.38);
  });
  zone.addEventListener('pointerup', release);
  zone.addEventListener('pointercancel', release);
}

const partMats = {};
function sparks(x, y, z, color, n = 10, speed = 6) {
  partMats[color] ||= new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(3), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
  for (let i = 0; i < n && parts.length < 350; i++) {
    const m = new THREE.Mesh(G.part, partMats[color]);
    m.position.set(x, y, z);
    scene.add(m);
    const life = rand(0.35, 0.8);
    parts.push({ m, vx: rand(-1, 1) * speed, vy: rand(0.4, 1.4) * speed, vz: rand(-1, 1) * speed, life, max: life });
  }
}
function updateParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.vy -= 20 * dt;
    p.m.position.x += p.vx * dt; p.m.position.y += p.vy * dt; p.m.position.z += p.vz * dt;
    if (p.m.position.y < 0.06) { p.m.position.y = 0.06; p.vy *= -0.4; p.vx *= 0.7; p.vz *= 0.7; }
    p.life -= dt;
    p.m.scale.setScalar(Math.max(0.01, p.life / p.max));
    if (p.life <= 0) { scene.remove(p.m); parts.splice(i, 1); }
  }
}
const boltMat = glow(0xff2a6d, 4);
const shocks = [], shockGeo = new THREE.RingGeometry(0.85, 1, 48);
function boomFx(x, z, color, size = 1) {
  boomLight.position.set(x, 1.5, z);
  boomLight.color.set(color);
  boomLight.intensity = 140 * size;
  const m = new THREE.Mesh(shockGeo, additive(color, 0.9, 3));
  m.rotation.x = -Math.PI / 2;

function updateFx(dt) {
  boomLight.intensity *= Math.exp(-dt * 7);

function fireBolt(x, y, z, dx, dz, speed = 16) {
  const l = Math.hypot(dx, dz) || 1;
  dx /= l; dz /= l;
  const g = new THREE.Group();
  const m = new THREE.Mesh(G.bolt, boltMat);

  g.add(m);
  g.position.set(x, y, z);

function updateBolts(dt) {
  for (let i = bolts.length - 1; i >= 0; i--) {
    const b = bolts[i];
    b.x += b.vx * dt; b.z += b.vz * dt; b.life -= dt;
    b.obj.position.set(b.x, b.y, b.z);
    let gone = b.life <= 0 || Math.abs(b.x) > W || Math.abs(b.z) > W || buildings.some(r => insideRect(b.x, b.z, r));
    if (!gone && Math.hypot(b.x - cat.x, b.z - cat.z) < 0.6 && Math.abs(cat.y + 0.5 - b.y) < 0.8) { hurtCat(1, b.x - b.vx, b.z - b.vz); gone = true; }

// =====================================================================
// Smoke: slash, getting hurt, moving
// =====================================================================
const SLASH_T = 0.26;    // how long the paw swipe animation lasts
function slash() {
  if (cat.slashCd > 0) return;
  cat.slashCd = 0.28;
  cat.slashT = SLASH_T;
  cat.slashSide = -(cat.slashSide || 1);    // left paw, right paw, left paw...
  sfx.slash();
  // a little help aiming: turn towards the closest robot dog or generator in reach
  const targets = [...dogs.filter(d => !d.dead && cat.y < 1.0), ...gens.filter(g => !g.dead)]
    .map(o => ({ o, d: Math.hypot(o.x - cat.x, o.z - cat.z) - o.r })).filter(t => t.d < 2.3).sort((a, b) => a.d - b.d);
  if (targets[0]) cat.heading = Math.atan2(targets[0].o.x - cat.x, targets[0].o.z - cat.z);
  const hx = Math.sin(cat.heading), hz = Math.cos(cat.heading);
  if (cat.grounded) { cat.vx += hx * 4; cat.vz += hz * 4; }
  const inFront = (x, z, reach) => {
    const dx = x - cat.x, dz = z - cat.z, d = Math.hypot(dx, dz);
    return d < reach && (d < 0.6 || (dx * hx + dz * hz) / d > 0.1);
  };
  if (cat.y < 1.0) for (const d of dogs) if (!d.dead && inFront(d.x, d.z, 2.3 + d.r)) hitDog(d, 1, hx, hz);
  for (const g of gens) if (!g.dead && inFront(g.x, g.z, 2.3 + g.r)) hitGenerator(g);
  for (let i = bolts.length - 1; i >= 0; i--) {
    const b = bolts[i];
    if (inFront(b.x, b.z, 2.6)) { sparks(b.x, b.y, b.z, 0x7ff6ff, 6, 4); scene.remove(b.obj); bolts.splice(i, 1); addScore(5); }
  }
}
function hurtCat(dmg, fx, fz) {
  if (cat.invuln > 0 || state !== 'play') return;
  cat.hp -= dmg;
  cat.invuln = 1.3;
  const dx = cat.x - fx, dz = cat.z - fz, l = Math.hypot(dx, dz) || 1;
  cat.vx = dx / l * 11; cat.vz = dz / l * 11; cat.vy = 5; cat.grounded = false; cat.kb = 0.3;
  flash();
  sfx.hurt();
  shake = 0.35;
  updateHud();
  if (cat.hp <= 0) failChapter();
}
function updateCat(dt) {
  let f = 0, r = 0;
  if (held('forward')) f += 1;
  if (held('back')) f -= 1;
  if (held('right')) r += 1;
  if (held('left')) r -= 1;
  if (held('camLeft')) camYaw += 2.2 * dt;
  if (held('camRight')) camYaw -= 2.2 * dt;

  const fx = -Math.sin(camYaw), fz = -Math.cos(camYaw), rx = Math.cos(camYaw), rz = -Math.sin(camYaw);
  let mx = fx * f + rx * r, mz = fz * f + rz * r;
  const len = Math.hypot(mx, mz), moving = len > 0.01;
  if (moving) { mx /= len; mz /= len; }

  const sprinting = moving && held('sprint') && cat.stamina > 0.02;
  cat.stamina = clamp(cat.stamina + (sprinting ? -0.42 : 0.22) * dt, 0, 1);
  const speed = moving ? (sprinting ? CAT_SPRINT : CAT_WALK) : 0;
  cat.kb -= dt;
  if (cat.kb <= 0) {
    const accel = 1 - Math.exp(-(cat.grounded ? 14 : 5) * dt);
    cat.vx += (mx * speed - cat.vx) * accel;
    cat.vz += (mz * speed - cat.vz) * accel;
  }
  cat.x += cat.vx * dt;
  cat.z += cat.vz * dt;

  for (const b of buildings) pushRect(cat, b, CAT_R);
  for (const c of crates) if (cat.y < c.top - 0.15) pushRect(cat, c, CAT_R);
  for (const g of gens) pushCircle(cat, g.x, g.z, g.r + CAT_R);
  cat.x = clamp(cat.x, -W + 0.5, W - 0.5);
  cat.z = clamp(cat.z, -W + 0.5, W - 0.5);

  let groundY = 0;
  for (const c of crates) if (insideRect(cat.x, cat.z, c, 0.1) && cat.y >= c.top - 0.15) groundY = c.top;
  cat.vy -= GRAVITY * dt;
  cat.y += cat.vy * dt;
  if (cat.y <= groundY) { if (!cat.grounded && cat.vy < -4) cat.land = 0.2; cat.y = groundY; cat.vy = 0; cat.grounded = true; }
  else if (cat.y > groundY + 0.05) cat.grounded = false;

  const bush = cat.y < 0.3 ? bushes.find(b => Math.hypot(cat.x - b.x, cat.z - b.z) < b.r) : null;
  if (bush !== cat.hidden) {
    if (cat.hidden) cat.hidden.material.opacity = 0.82;
    if (bush) bush.material.opacity = 0.4;
    cat.hidden = bush || null;
  }

  for (const fi of fishes) {
    if (fi.got || Math.hypot(cat.x - fi.x, cat.z - fi.z) > 1.1 || Math.abs(cat.y + 0.5 - fi.y) > 1.2) continue;
    fi.got = true;
    fi.obj.visible = false;
    addScore(10);
    sfx.fish();
    if (cat.hp < MAX_HP) { cat.hp++; toast('+1 ❤️', 800); }
    updateHud();
  }

  if (beacon && Math.hypot(cat.x - beacon.x, cat.z - beacon.z) < 1.8) { winChapter(); return; }

  cat.invuln = Math.max(0, cat.invuln - dt);
  cat.slashCd -= dt;

  const hSpeed = Math.hypot(cat.vx, cat.vz);
  if (hSpeed > 0.3 && cat.kb <= 0) cat.heading = lerpAngle(cat.heading, Math.atan2(cat.vx, cat.vz), 1 - Math.exp(-12 * dt));
  // running left or right: the camera swings round behind Smoke (but not just after the mouse turned it)
  if (r !== 0 && hSpeed > 1 && cat.kb <= 0 && now - lastDrag > 1) camYaw = lerpAngle(camYaw, cat.heading + Math.PI, 1 - Math.exp(-1.0 * dt));
  catObj.position.set(cat.x, cat.y, cat.z);
  catObj.rotation.y = cat.heading;
  animateCat(dt, hSpeed);
  catObj.visible = cat.invuln <= 0 || Math.floor(cat.invuln * 10) % 2 === 0;
  $('stamina').style.width = `${cat.stamina * 100}%`;
}

// Smoke's body language: walking, galloping, turning, jumping, landing, hiding and the paw swipe
const pawTip = new THREE.Vector3();
const WALK_OFF = [Math.PI * 0.5, Math.PI * 1.5, 0, Math.PI];        // a cat walk: each paw in turn
const RUN_OFF = [0, 0.45, Math.PI, Math.PI + 0.45];                 // a gallop: front paws, then back paws
function animateCat(dt, hSpeed) {
  const { legs, rig, head, eyes, ears, tailSegs, claws } = catObj.userData;
  const ease = (v, target, speed) => v + (target - v) * Math.min(1, dt * speed);

  // how fast Smoke is turning: the body leans into the turn and the head turns first
  const turnNow = clamp(angleDiff(cat.heading, cat.lastHeading ?? cat.heading) / Math.max(dt, 1e-3), -14, 14);
  cat.lastHeading = cat.heading;
  cat.turn = ease(cat.turn || 0, turnNow, 8);
  const turning = Math.min(Math.abs(cat.turn) / 6, 1);

  const walk = Math.min(hSpeed / CAT_WALK, 1.2), run = clamp((hSpeed - 9) / 3, 0, 1);
  const stepping = cat.grounded ? Math.max(walk, turning * 0.7) : 0;   // little steps when turning on the spot
  cat.phase += dt * (5 + hSpeed * 1.05 + turning * 7);
  const swing = stepping * (0.55 + run * 0.25);
  cat.land = Math.max(0, (cat.land || 0) - dt);
  const squash = cat.land / 0.2, hide = cat.hidden ? 1 : 0;
  cat.idle = hSpeed < 0.3 && cat.grounded ? (cat.idle || 0) + dt : 0;

  // the paw swipe: up and out, a fast swipe across, then back down
  const sp = cat.slashT > 0 ? 1 - cat.slashT / SLASH_T : -1, side = cat.slashSide || 1, paw = side > 0 ? 1 : 0;
  let up = 0, across = 0, curl = 0;
  if (sp >= 0) {
    if (sp < 0.22) { const k = smooth(sp / 0.22); up = k; across = k; curl = k; }
    else if (sp < 0.6) { const k = smooth((sp - 0.22) / 0.38); up = 1 - 0.3 * k; across = 1 - 2 * k; curl = 1 - 0.5 * k; }
    else { const k = smooth((sp - 0.6) / 0.4); up = 0.7 * (1 - k); across = -(1 - k); curl = 0.5 * (1 - k); }
  }
  claws.forEach((c, i) => { c.visible = sp >= 0 && sp < 0.8 && i === paw; });

  legs.forEach((l, i) => {
    const front = i < 2, knee = l.userData.knee;
    const off = WALK_OFF[i] + (RUN_OFF[i] - WALK_OFF[i]) * run, ph = cat.phase + off;
    let hip = Math.sin(ph) * swing, bend = Math.max(0, -Math.cos(ph)) * swing * 1.7 * (front ? 1 : -1), out = 0;
    if (!cat.grounded) {
      // in the air: front paws reach forward, back paws stretch out behind
      const rise = clamp(cat.vy / JUMP, -1, 1);
      hip = front ? -0.75 - rise * 0.25 : 0.7 + rise * 0.3;
      bend = front ? 0.35 : -0.45;
    }
    // crouch low in a bush, and bend the knees when landing
    hip += (front ? -0.25 : 0.35) * hide + (front ? -0.2 : 0.25) * squash;
    bend += (front ? 0.55 : -0.75) * hide + (front ? 0.45 : -0.6) * squash;
    if (sp >= 0 && front) {
      if (i === paw) { hip = -1.75 * up; out = side * 0.9 * across; bend = -0.35 * curl; }
      else { hip = 0.25 * up; bend = 0.35 * up; }        // the other front paw braces
    }
    l.rotation.set(hip, out, 0, 'YXZ');      // lift the leg, then swing it left or right
    knee.rotation.x = bend;
  });

  // the whole body: bob, lean into turns, twist with the swipe, squash on landing, breathe when still
  const lean = clamp(-cat.turn * 0.035 * Math.min(1, hSpeed / 4), -0.28, 0.28);
  const pitch = !cat.grounded ? -cat.vy * 0.015 : cat.kb > 0 ? -0.3 : run * 0.1 + Math.sin(cat.phase * 2) * 0.05 * run - 0.25 * up;
  rig.rotation.x = ease(rig.rotation.x, pitch, 10);
  rig.rotation.z = ease(rig.rotation.z, lean, 8);
  rig.rotation.y = ease(rig.rotation.y, side * 0.28 * across, 25);

  rig.position.z = 0.1 * up;

  if (cat.grounded) {
    catObj.updateMatrixWorld(true);
    let low = Infinity;
    for (const l of legs) low = Math.min(low, l.userData.knee.localToWorld(pawTip.set(0, -0.27, 0.03)).y);

  // the head: leads turns, stays on target during a swipe, looks around when standing still
  const look = cat.idle > 1.5 ? Math.sin(now * 0.45) * 0.45 * Math.min(1, (cat.idle - 1.5) / 1) : 0;
  head.rotation.y = ease(head.rotation.y, clamp(cat.turn * 0.07, -0.5, 0.5) - rig.rotation.y * 0.8 + look, 10);

  // the tail curls up when walking, streams out when running, swings out on turns
  tailSegs.forEach((sg, i) => {
    sg.rotation.x = (i === 0 ? -1.0 - run * 0.5 - (cat.grounded ? 0 : 0.4) : 0.2 - run * 0.18) + Math.sin(now * 2.2 - i * 0.5) * 0.05;
    sg.rotation.z = Math.sin(now * 1.6 - i * 0.6) * (0.08 + 0.04 * i) * (1 - run * 0.6) + clamp(cat.turn * 0.025, -0.15, 0.15);

      l.userData.knee.rotation.x = front ? 0.15 * nap : -2.1 * nap;
    });

    rig.rotation.set(0, 0, 0);
    head.rotation.set(0.35 * nap, 0.45 * nap, 0.15 * nap);
    eyes.forEach(e => { e.scale.y = nap > 0.5 ? 0.1 : 1; });
    tailSegs.forEach((sg, i) => { sg.rotation.x = i === 0 ? -0.15 : 0.1; sg.rotation.z = 0.32 * nap; });
  }

  const climb = cat.climb || 0;

    rig.rotation.set(-1.3 * climb, 0, 0);

    rig.scale.set(1, 1, 1);
    legs.forEach((l, i) => {
      const front = i < 2, ph = cat.phase * 0.7 + (i % 2 ? Math.PI : 0) + (front ? 0 : Math.PI / 2);

      l.userData.knee.rotation.x = front ? 0.6 + Math.max(0, Math.cos(ph)) * 0.6 : -0.9 - Math.max(0, Math.cos(ph)) * 0.5;
    });
    head.rotation.set(0.9, 0, 0);
    tailSegs.forEach((sg, i) => { sg.rotation.x = i === 0 ? 0.6 : 0.1; sg.rotation.z = Math.sin(now * 2 - i * 0.6) * 0.12; });
  }
}

// =====================================================================
// Robot dogs: getting hit, thinking, moving
// =====================================================================
function hitDog(d, dmg, hx, hz) {

  const dizzy = d.t.boss && d.bState === 'dizzy';
  d.hp -= dmg * (dizzy ? 2 : 1);
  d.flash = 0.12;
  sparks(d.x, 1 * d.t.scale, d.z, d.t.eye, 8, 5);
  sfx.hit();
  if (!d.t.heavy) { d.kx = hx * 11; d.kz = hz * 11; d.stun = 0.45; }
  else if (!d.t.boss) { d.kx = hx * 3; d.kz = hz * 3; d.stun = 0.12; }
  d.state = 'chase';
  d.lastX = cat.x; d.lastZ = cat.z;
  drawHpBar(d);
  updateHud();
  if (dizzy) toast(t('doubleDamage'), 600);
  if (d.hp <= 0) destroyDog(d);
}
function disposeDog(obj) {
  const u = obj.userData;
  obj.traverse(o => { if (o.userData.merged) o.geometry.dispose(); });
  for (const m of [u.metal, u.eyeM, u.hpSprite.material]) m.dispose();
  u.hpTex.dispose();

}
function destroyDog(d) {
  d.dead = true;
  levelGroup.remove(d.obj);
  sparks(d.x, 1, d.z, d.t.eye, d.t.boss ? 60 : 18, d.t.boss ? 12 : 7);
  sparks(d.x, 1, d.z, 0x777b88, d.t.boss ? 40 : 10, 6);
  boomFx(d.x, d.z, d.t.eye, d.t.boss ? 3 : 1);
  disposeDog(d.obj);
  sfx.boom();
  shake = d.t.boss ? 0.8 : 0.15;
  addScore(d.t.points);
  defeated++;
  dogs = dogs.filter(o => o !== d);
  updateHud();
  if (d.t.boss) { state = 'outro'; outroTimer = 2; clearLasers(); toast(t('bossDown'), 2000); }
}
function hitGenerator(g) {
  g.hp--;
  g.flash = 0.15;
  sparks(g.x, 1.8, g.z, 0x5cff9d, 10, 6);
  sfx.hit();
  const x = g.hpCanvas.getContext('2d');
  x.fillStyle = 'rgba(0,0,0,.7)'; x.fillRect(0, 0, 64, 8);
  x.fillStyle = '#5cff9d'; x.fillRect(1, 1, 62 * Math.max(0, g.hp) / g.maxHp, 6);
  g.hpTex.needsUpdate = true;
  g.hpSprite.visible = g.hp > 0;
  if (g.hp > 0) return;
  g.dead = true;
  g.core.material = M.genDead;
  g.rings.forEach(r => { r.visible = false; });
  sparks(g.x, 2, g.z, 0x5cff9d, 30, 9);
  sparks(g.x, 2, g.z, 0xffffff, 15, 7);
  boomFx(g.x, g.z, 0x5cff9d, 1.6);
  sfx.boom();
  shake = 0.4;

  addScore(100);
  toast(t('genDown', gensDone, gens.length), 1400);
  updateHud();

let lastBark = 0, lastSpotToast = -10, now = 0;
function steer(d, ux, uz) {
  for (const b of buildings) {
    const px = clamp(d.x, b.x - b.hx, b.x + b.hx), pz = clamp(d.z, b.z - b.hz, b.z + b.hz);
    const ox = d.x - px, oz = d.z - pz, od = Math.hypot(ox, oz), reach = 1.8 + d.r;

    const ox = d.x - o.x, oz = d.z - o.z, od = Math.hypot(ox, oz), reach = o.r + 1.6;
    if (od < reach && od > 0.01) { const w = (reach - od) / reach * 1.5; ux += ox / od * w; uz += oz / od * w; }

}
function collideDog(d) {
  let hit = false;
  for (const b of buildings) hit = pushRect(d, b, d.r) || hit;
  for (const c of crates) hit = pushRect(d, c, d.r) || hit;
  for (const g of gens) hit = pushCircle(d, g.x, g.z, g.r + d.r) || hit;
  const lim = W - 0.6 - d.r;
  if (Math.abs(d.x) > lim || Math.abs(d.z) > lim) hit = true;
  d.x = clamp(d.x, -lim, lim);
  d.z = clamp(d.z, -lim, lim);

function updateDog(d, dt) {
  const t = d.t;
  d.biteCd -= dt; d.shootCd -= dt; d.stun -= dt; d.flash -= dt;
  d.x += d.kx * dt; d.z += d.kz * dt;
  const k = Math.exp(-7 * dt);
  d.kx *= k; d.kz *= k;

  d.retreat -= dt;
  const dx = cat.x - d.x, dz = cat.z - d.z, dist = Math.hypot(dx, dz);
  const sees = dist < t.sight && (!cat.hidden || dist < 3) && losClear(d.x, d.z, cat.x, cat.z);
  if (sees) {

      if (now - lastSpotToast > 6) { toast(say(T.spotted)(t.name), 1200); lastSpotToast = now; }
      callPack(d);
    }
    d.state = 'chase';
    d.lastX = cat.x; d.lastZ = cat.z; d.lastVX = cat.vx; d.lastVZ = cat.vz;
    // Smarter dogs: run to where Smoke is going, not where Smoke is

    d.tx = cat.x + cat.vx * ahead; d.tz = cat.z + cat.vz * ahead;

    if (cat.y > 1) {

      const a = Math.atan2(d.x - cat.x, d.z - cat.z) + d.flank * 0.6;
      d.tx = cat.x + Math.sin(a) * 2.8; d.tz = cat.z + Math.cos(a) * 2.8;
    } else if (t.shooter && dist < 6) {

    } else if (d.retreat > 0) {

    }
  } else if (d.state === 'chase') {
    // lost Smoke: run on the way Smoke was going
    d.state = 'search'; d.sniffed = false; d.timer = 5;
    d.tx = clamp(d.lastX + d.lastVX * 0.8, -W + 3, W - 3); d.tz = clamp(d.lastZ + d.lastVZ * 0.8, -W + 3, W - 3);

  const toT = Math.hypot(d.tx - d.x, d.tz - d.z);
  if (d.state === 'search') {

      d.sniffed = true;
      const bush = bushes.filter(b => Math.hypot(b.x - d.x, b.z - d.z) < 8).sort((a, b) => Math.hypot(a.x - d.x, a.z - d.z) - Math.hypot(b.x - d.x, b.z - d.z))[0];
      if (bush && Math.random() < 0.5) {
        const bl = Math.hypot(d.x - bush.x, d.z - bush.z) || 1;
        d.tx = bush.x + (d.x - bush.x) / bl; d.tz = bush.z + (d.z - bush.z) / bl; d.timer = 3;
      } else d.timer = 0;
    } else if (d.timer <= 0 || (toT < 0.8 && d.sniffed)) { d.state = 'wander'; d.timer = 0; }
  }
  if (d.state === 'wander') {
    d.timer -= dt;
    if (d.timer <= 0 || toT < 0.8) {

      d.tz = clamp(d.z + rand(-14, 14), -W + 3, W - 3);

  if (d.state === 'chase' && dist < d.r + 0.6) speed = 0;
  if (toT < 0.5) speed = 0;
  if (d.stun > 0) speed = 0;

  // Zap-Hounds stop, flash their eyes, then shoot
  if (t.shooter && d.state === 'chase' && sees && dist < 15 && dist > 3.5 && d.shootCd <= 0 && d.aim <= 0 && d.stun <= 0) d.aim = 0.5;

  let ux = d.tx - d.x, uz = d.tz - d.z;

  d.z += uz * d.speed * dt;
  collideDog(d);

  if (dist < d.r + 0.85 && cat.y < 0.9 && d.biteCd <= 0 && d.stun <= 0) { hurtCat(t.dmg, d.x, d.z); d.biteCd = 1.1; d.bite = 0.3; if (d.type === 'dash') d.retreat = 0.8; }

  else if (d.speed > 0.2) d.heading = lerpAngle(d.heading, Math.atan2(ux, uz), 1 - Math.exp(-8 * dt));
  animateDog(d, d.aim > 0 ? 6 + Math.sin(now * 40) * 4 : 2.5, dt);
}

function updateBoss(d, dt) {
  const t = d.t;
  d.biteCd -= dt; d.flash -= dt; d.bTimer -= dt;
  const dx = cat.x - d.x, dz = cat.z - d.z, dist = Math.hypot(dx, dz);
  const { warnLine } = d.obj.userData;
  let speed = 0, eye = 2.5;
  warnLine.material.opacity = 0;

  if (d.bState === 'walk') {
    speed = t.speed;
    d.heading = lerpAngle(d.heading, Math.atan2(dx, dz), 1 - Math.exp(-3 * dt));
    if (d.bTimer <= 0) {
      d.bMoves++;
      if (d.bMoves % 3 === 0) { d.bState = 'aim'; d.bTimer = 0.7; }
      else { d.bState = 'windup'; d.bTimer = 1.0; sfx.warn(); }
    }
  } else if (d.bState === 'windup') {
    d.heading = lerpAngle(d.heading, Math.atan2(dx, dz), 1 - Math.exp(-6 * dt));
    eye = 6 + Math.sin(now * 30) * 4;
    warnLine.material.opacity = 0.25 + Math.sin(now * 30) * 0.15;
    if (d.bTimer <= 0) { d.bState = 'charge'; d.bTimer = 2.5; d.chargeX = Math.sin(d.heading); d.chargeZ = Math.cos(d.heading); sfx.roar(); }
  } else if (d.bState === 'charge') {
    eye = 6;
    d.x += d.chargeX * 22 * dt;
    d.z += d.chargeZ * 22 * dt;
    sparks(d.x, 0.2, d.z, 0xff2020, 1, 2);
    if (dist < d.r + 0.9 && cat.y < 1.8) hurtCat(2, d.x, d.z);
    if (collideDog(d)) {
      d.bState = 'dizzy'; d.bTimer = 2.4;
      sparks(d.x, 2, d.z, 0xffe066, 25, 8); sfx.boom(); shake = 0.6;
      toast(say(T.crashed), 1500);
    } else if (d.bTimer <= 0) { d.bState = 'walk'; d.bTimer = rand(2.5, 3.5); }
  } else if (d.bState === 'dizzy') {
    eye = 0.6;
    d.obj.userData.head.rotation.y = Math.sin(now * 8) * 0.4;
    if (Math.random() < 0.1) sparks(d.x, 2.8 * t.scale * 0.5 + 1.5, d.z, 0xffe066, 1, 2);
    if (d.bTimer <= 0) { d.bState = 'walk'; d.bTimer = rand(2, 3); d.obj.userData.head.rotation.y = 0; }
  } else if (d.bState === 'aim') {
    d.heading = lerpAngle(d.heading, Math.atan2(dx, dz), 1 - Math.exp(-6 * dt));
    eye = 5;
    if (d.bTimer <= 0) {
      const base = Math.atan2(dx, dz);
      for (let i = -3; i <= 3; i++) {
        const a = base + i * 0.18;
        fireBolt(d.x + Math.sin(a) * 2, 1.0, d.z + Math.cos(a) * 2, Math.sin(a), Math.cos(a), 14);

  if (d.summoned === 0 && d.hp <= 20) { d.summoned = 1; callBackup(d, ['scout', 'scout']); }
  if (d.summoned === 1 && d.hp <= 10) { d.summoned = 2; callBackup(d, ['dash', 'zap']); }

  if (d.bState !== 'charge') {
    let ux = Math.sin(d.heading), uz = Math.cos(d.heading);
    [ux, uz] = steer(d, ux, uz);
    const l = Math.hypot(ux, uz) || 1;
    if (dist < d.r + 0.6) speed = 0;
    d.speed += (speed - d.speed) * (1 - Math.exp(-5 * dt));
    d.x += ux / l * d.speed * dt;
    d.z += uz / l * d.speed * dt;
    collideDog(d);
    if (dist < d.r + 0.9 && cat.y < 1.8 && d.biteCd <= 0 && d.bState !== 'dizzy') { hurtCat(t.dmg, d.x, d.z); d.biteCd = 1.2; d.bite = 0.3; }
  } else d.speed = 14;
  animateDog(d, eye, dt);
}
function callBackup(boss, types) {
  toast(t('backup'), 1600);
  sfx.roar();
  for (const type of types) {
    const p = freeSpot(0.8, { near: { x: boss.x, z: boss.z, d: 9 }, awayFrom: [{ x: cat.x, z: cat.z, d: 5 }] });
    if (p) { const d = spawnDog(type, p.x, p.z); d.state = 'chase'; d.tx = cat.x; d.tz = cat.z; }
  }

// a dog that spots Smoke barks, and the dogs near it come to look
function callPack(spotter) {
  for (const o of dogs) {
    if (o === spotter || o.t.boss || o.state === 'chase' || Math.hypot(o.x - spotter.x, o.z - spotter.z) > 16) continue;
    o.state = 'search'; o.sniffed = false; o.timer = 6;

}

function animateDog(d, eyeGlow, dt) {
  const { legs, tail, metal, eyeM, body, head, jaw } = d.obj.userData;
  const ease = (v, target, speed) => v + (target - v) * Math.min(1, dt * speed);
  const sc = d.t.scale, boss = d.t.boss;

  d.obj.rotation.y = d.heading;

  const turnNow = clamp(angleDiff(d.heading, d.lastHeading ?? d.heading) / Math.max(dt, 1e-3), -10, 10);
  d.lastHeading = d.heading;
  d.turn = ease(d.turn || 0, turnNow, 8);

  const windup = boss && d.bState === 'windup', dizzy = boss && d.bState === 'dizzy';

    if (dizzy) hip += Math.sin(now * 5 + i * 1.7) * 0.25;

  });

  const toCat = angleDiff(Math.atan2(cat.x - d.x, cat.z - d.z), d.heading), dist = Math.hypot(cat.x - d.x, cat.z - d.z);

// Camera (moves in front of buildings so Smoke stays visible)
// =====================================================================
const lookAt = new THREE.Vector3(), camTarget = new THREE.Vector3(), camDir = new THREE.Vector3(), camBack = new THREE.Vector3();
const bMin = new THREE.Vector3(), bMax = new THREE.Vector3();
let camPitchNow = 0.5;
// how far the camera can go from Smoke in direction `dir` before it would be inside a building or the city wall
const inBox = p => p.x > bMin.x && p.x < bMax.x && p.y > bMin.y && p.y < bMax.y && p.z > bMin.z && p.z < bMax.z;
function clearDistance(dir, maxDist) {
  let dist = maxDist;
  const test = () => { if (inBox(lookAt)) return; const t = rayBox(lookAt, dir, bMin, bMax); if (t !== null && t < dist) dist = t; };
  for (const b of buildings) {
    bMin.set(b.x - b.hx - 0.25, -1, b.z - b.hz - 0.25);
    bMax.set(b.x + b.hx + 0.25, b.h + 0.6, b.z + b.hz + 0.25);
    test();
  }
  for (const o of overhangs) {               // shop awnings and hanging signs
    bMin.set(o.x - o.hx - 0.15, o.y - o.hy - 0.15, o.z - o.hz - 0.15);
    bMax.set(o.x + o.hx + 0.15, o.y + o.hy + 0.15, o.z + o.hz + 0.15);
    test();
  }
  for (const k of ['x', 'z']) {
    if (Math.abs(dir[k]) < 1e-6) continue;
    const t = (Math.sign(dir[k]) * (W - 0.5) - lookAt[k]) / dir[k];
    if (t < dist) dist = t;
  }
  return dist;
}
const setDir = (v, yaw, pitch) => v.set(Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), Math.cos(yaw) * Math.cos(pitch));
// find the nearest camera spot around Smoke with a clear view: first try lifting the camera a bit,
// then swing it around to the open side (like most 3D games do when you walk along a wall)
function findView() {
  const want = Math.min(camDist, 3.2), lifted = Math.min(camPitch + 0.35, 1.25);
  const clear = (yaw, pitch) => clearDistance(setDir(camDir, yaw, pitch), camDist) - 0.25 >= want;
  for (const pitch of [camPitch, lifted]) if (clear(camYaw, pitch)) return [camYaw, pitch];
  for (let k = 1; k <= 12; k++) for (const sgn of [1, -1]) {
    const yaw = camYaw + sgn * k * 0.26;
    for (const pitch of [camPitch, lifted]) if (clear(yaw, pitch)) return [yaw, pitch];
  }
  return [camYaw, 1.5];                         // boxed in: look down from above
}
function updateCamera(dt, snap = false) {
  lookAt.set(cat.x, cat.y + 1, cat.z);
  const [yaw, pitch] = findView();
  if (snap) { camYaw = yaw; camPitchNow = pitch; }
  else {
    camYaw += (yaw - camYaw) * (1 - Math.exp(-6 * dt));
    camPitchNow += (pitch - camPitchNow) * (1 - Math.exp(-(pitch > camPitchNow ? 10 : 3) * dt));
  }
  setDir(camDir, camYaw, camPitchNow);
  const dist = Math.max(0.6, clearDistance(camDir, camDist) - 0.25);
  camTarget.copy(camDir).multiplyScalar(dist).add(lookAt);
  if (snap) camera.position.copy(camTarget);
  else camera.position.lerp(camTarget, 1 - Math.exp(-10 * dt));
  // while gliding to its new spot, the camera must never pass through a building
  camBack.subVectors(camera.position, lookAt);
  const len = camBack.length();
  if (len > 1e-3) {
    camBack.divideScalar(len);
    const free = clearDistance(camBack, len);
    if (free < len) camera.position.copy(camBack).multiplyScalar(Math.max(0.5, free - 0.2)).add(lookAt);
  }
  if (shake > 0) camera.position.add(new THREE.Vector3(rand(-1, 1), rand(-1, 1), rand(-1, 1)).multiplyScalar(shake * 0.4));

}

const mm = $('minimap').getContext('2d'), bm = $('mapCanvas').getContext('2d');

function drawMap(c, S) {

  c.clearRect(0, 0, S, S);

    c.strokeStyle = 'rgba(74,58,160,.35)';
    c.lineWidth = 1;
    for (let i = -W; i <= W; i += 6) { c.beginPath(); c.moveTo(mx(i), 0); c.lineTo(mx(i), S); c.moveTo(0, mz(i)); c.lineTo(S, mz(i)); c.stroke(); }

  c.fillStyle = '#1f7a5a';

  c.fillStyle = '#6a7090';
  for (const cr of crates) c.fillRect(mx(cr.x) - 2.5 * u, mz(cr.z) - 2.5 * u, 5 * u, 5 * u);

  if (beacon) { c.fillStyle = '#36e7ff'; dot(beacon.x, beacon.z, 6 + Math.sin(now * 4)); }
  for (const d of dogs) {
    c.fillStyle = '#' + new THREE.Color(d.t.eye).getHexString();

    c.font = 'bold 15px Trebuchet MS, sans-serif';

}

// camera moves: each returns [camera position, point to look at]
const orbitCam = (cx, cy, cz, r, h, a0, a1) => e => { const a = a0 + (a1 - a0) * e; return [[cx + Math.sin(a) * r, cy + h, cz + Math.cos(a) * r], [cx, cy, cz]]; };
const moveCam = (p0, p1, l0, l1 = l0) => e => [p0.map((v, i) => v + (p1[i] - v) * e), l0.map((v, i) => v + (l1[i] - v) * e)];
// is this point inside a building (or the stuff on its roof)?
// (the roof Smoke stands on only counts up to its top)
const blocked3 = (x, y, z, own = null) => Math.abs(x) > W - 1 || Math.abs(z) > W - 1 ||
  buildings.some(b => insideRect(x, z, b, 0.6) && y < (b === own ? b.h + 0.2 : b.h + (b.h > 14 ? 11 : 1.3)));
function clearView(p, q) {               // can a camera at p see q?
  const own = buildings.find(b => insideRect(q[0], q[2], b, 0.6) && q[1] >= b.h - 0.1) || null;
  if (blocked3(...p, own)) return false;
  for (let i = 1; i < 9; i++) { const t = i / 10; if (blocked3(p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t, p[2] + (q[2] - p[2]) * t, own)) return false; }
  return true;
}
function safeOrbit(cx, cy, cz, r, h, span) {
  // find a way round that does not go through a building

    const a0 = i / 16 * Math.PI * 2;
    let ok = true;
    for (let j = 0; j <= 8 && ok; j++) { const a = a0 + span * j / 8; ok = clearView([cx + Math.sin(a) * r, cy + h, cz + Math.cos(a) * r], [cx, cy, cz]); }
    if (ok) return orbitCam(cx, cy, cz, r, h, a0, a0 + span);
  }
  return orbitCam(cx, cy, cz, r * 0.5, h + 6, 0, span);
}
function openSide(x, z, dist, y = 1.4, lookY = 1) {   // a direction from (x, z) with open space to put the camera
  for (let i = 0; i < 16; i++) { const a = i / 16 * Math.PI * 2; if (clearView([x + Math.sin(a) * dist, y, z + Math.cos(a) * dist], [x, lookY, z])) return a; }

}
const hop = (t, speed = 5, height = 0.5) => { const s = Math.sin(t * speed), up = Math.abs(s) * height; return [up, up > 0.03 ? Math.cos(t * speed) * Math.sign(s) * speed * height : 0]; };

// ---- playing a scene ----
function runScene(shots, onDone, title = '') {
  hideOverlay();
  $('objective').style.display = 'none';
  state = 'cutscene';
  document.body.classList.add('cine');
  cut = { shots, i: -1, t: 0, onDone, temp: [], lasers: [], saved: dogs.map(d => [d, d.x, d.z, d.heading, d.bState]) };
  if (title) showTitle(title, 2800);

}
function showTitle(text, ms) {
  const el = $('cineTitle');

  clearTimeout(showTitle.timer);

}
const fade = v => { $('fade').style.opacity = v; };
function nextShot() {
  cut.i++;

  const s = cut.shots[cut.i];
  cut.t = 0; cut.f = {};
  for (const a of [dogeActor, holoBolt]) if (a) a.visible = false;
  s.start?.();
  if (s.title) showTitle(s.title, 2600);
  cut.lines = s.lines || [];             // a shot can have a few lines of talk, one after the other
  cut.li = 0;
  showLine();
  cut.len = Math.max(s.dur || 2, cut.lines.reduce((sum, l) => sum + readTime(l), 0));
}
const readTime = l => 2 + lineText(l).length * 0.055;     // time to read a line
function showLine() {
  const l = cut.lines[cut.li];
  cut.lt = 0; cut.full = false;
  $('sub').style.display = l ? 'block' : 'none';
  if (!l) return;
  const [icon, name, color] = WHO[l[0]];
  $('subWho').innerHTML = name ? `${icon} <span style="color:${color}">${name}</span>` : icon;
  $('subText').textContent = '';
}
function advanceScene() {                // a click or Space: finish the line, then the next line, then the next shot
  const l = cut.lines[cut.li];
  if (l && !cut.full && cut.lt * 40 < lineText(l).length) { cut.full = true; return; }
  if (cut.li < cut.lines.length - 1) { cut.li++; showLine(); return; }
  nextShot();
}
function endScene() {
  const done = cut.onDone;
  for (const o of cut.temp) { o.parent?.remove(o); if (o.userData.metal) disposeDog(o); }
  if (cut.hatch) setHatch(cut.hatch, 0);           // close the manhole if the movie was skipped
  $('skipBtn').blur();                             // so Enter in the next movie doesn't press Skip
  inputLockUntil = performance.now() + 400;
  for (const [d, x, z, h, bs] of cut.saved) Object.assign(d, { x, z, heading: h, bState: bs, aim: 0, bite: 0, recoil: 0, speed: 0 });
  cut = null;
  for (const a of [boltActor, holoBolt, dogeActor]) if (a) a.visible = false;
  enterSewer(false);
  cat.nap = 0;
  cat.climb = 0;
  document.body.classList.remove('cine');
  $('sub').style.display = 'none';
  fade(0);
  state = 'between';
  done();
}
function updateScene(dt) {
  const s = cut.shots[cut.i];
  cut.t += dt;
  const k = clamp(cut.t / cut.len, 0, 1), l = cut.lines[cut.li];
  cut.lt += dt;
  if (l) {
    $('subText').textContent = lineText(l).slice(0, cut.full ? undefined : Math.floor(cut.lt * 40));
    if (cut.li < cut.lines.length - 1 && cut.lt >= readTime(l)) { cut.li++; showLine(); }
  }
  s.update?.(k, dt, cut.t);
  for (const l of cut.lasers) { l.g.position.x += l.dx * 22 * dt; l.g.position.z += l.dz * 22 * dt; }
  const [p, look] = s.cam(smooth(k), cut.t);
  camera.position.set(p[0], p[1], p[2]);
  if (shake > 0) camera.position.add(new THREE.Vector3(rand(-1, 1), rand(-1, 1), rand(-1, 1)).multiplyScalar(shake * 0.3));
  camera.lookAt(look[0], look[1], look[2]);
  if (cut.t >= cut.len && cut.li >= cut.lines.length - 1) nextShot();
}

// Main loop
// =====================================================================
const clock = new THREE.Clock(), touchBox = $('touch');
function frame() {
  touchBox.classList.toggle('on', state === 'play');
  step(Math.min(clock.getDelta(), 0.05));
  requestAnimationFrame(frame);
}
function step(dt) {
  now += dt;
  if (state === 'play') {
    playTime += dt;
    const hints = CHAPTERS[chapter].hints || [];
    if (hintsShown < hints.length && playTime > hints[hintsShown][0]) { toast(hints[hintsShown][1](), 2200); hintsShown++; }
    updateCat(dt);
    for (const d of [...dogs]) {
      if (state !== 'play') break;
      if (d.t.boss) updateBoss(d, dt); else updateDog(d, dt);
    }
    separateDogs();
    if (state === 'play') updateBolts(dt);
    if (state === 'play') { reinforce(dt); checkGoal(); }
    const chasing = dogs.filter(d => d.state === 'chase').length;
    // only when really standing on a crate (not in the middle of a jump); lasers are only mentioned once laser dogs are around
    const onCrate = cat.grounded && cat.y >= 1.1, lasers = dogs.some(d => d.t.shooter || d.t.boss);
    $('status').textContent = cat.hidden ? t('hiding') : onCrate ? t('onCrate') + (lasers ? t('notLasers') : '') : chasing ? t('chasing', chasing) : '';
  } else if (state === 'outro') {
    outroTimer -= dt;
    if (outroTimer <= 0) winChapter();
  } else if (state === 'cutscene' && cut) updateScene(dt);

  // slash effect
  if (cat.slashT > 0) cat.slashT -= dt;
  updateTrail();

  updateParts(dt);
  shake = Math.max(0, shake - dt);
  for (const f of fishes) if (!f.got) { f.obj.rotation.y += dt * 2; f.obj.position.y = f.y + Math.sin(now * 3 + f.x) * 0.12; }
  for (const g of gens) {
    if (g.dead) continue;
    g.rings.forEach((r, i) => { r.position.y = 1.2 + i * 1.2 + Math.sin(now * 3 + i) * 0.3; });
    g.core.material.emissiveIntensity = g.flash > 0 ? 5 : 1.3 + Math.sin(now * 6) * 0.4;
    g.flash -= dt;
  }
  if (beacon) { beacon.pad.material.opacity = 0.6 + Math.sin(now * 4) * 0.3; beacon.beam.material.opacity = 0.15 + Math.sin(now * 2) * 0.06; }
  for (const c of cars) {
    if (c.alongX) { c.obj.position.x += c.speed * dt; if (Math.abs(c.obj.position.x) > 100) c.obj.position.x = -Math.sign(c.speed) * 100; }
    else { c.obj.position.z += c.speed * dt; if (Math.abs(c.obj.position.z) > 100) c.obj.position.z = -Math.sign(c.speed) * 100; }
  }

  updateFx(dt);
  updateVents(dt);
  updateBillboards(dt);
  updateLampLights(dt);
  M.blink.emissiveIntensity = now % 1.4 < 0.18 ? 7 : 0.4;
  const sprinting = state === 'play' && held('sprint') && Math.hypot(cat.vx, cat.vz) > 10;
  camera.fov += ((sprinting ? 64 : 58) - camera.fov) * (1 - Math.exp(-4 * dt));
  camera.updateProjectionMatrix();
  if (shopOpen) shopCamera(dt);
  else if (state !== 'cutscene' && state !== 'end') updateCamera(dt);
  followCamera();
  checkSpeed(dt);
  if (window.smokeDebug?.fast) return;   // tests can run the game without drawing it
  drawMinimap();
  $('mapHint').textContent = state === 'play' ? t('mapHint', keyLabel('map')) : '';
  composer.render();
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  resizeReflector();
});

// for testing from the browser console
window.smokeDebug = {
  step, cat, keys, slash, startChapter, winChapter, playChapter, get cut() { return cut; }, get chapter() { return chapter; },
  get dogs() { return dogs; }, get gens() { return gens; }, get beacon() { return beacon; }, get state() { return state; },
  get fishes() { return fishes; }, get bolts() { return bolts; }, get score() { return score; }, get crates() { return crates; },
  setCam(yaw, pitch, dist) { camYaw = yaw; camPitch = pitch; camDist = dist; },
  THREE, camera, get scene() { return scene; }, get buildings() { return buildings; }, get level() { return levelGroup; },
  shop, wearOutfit, openShop,
  ui: { showMenu, chooseMode, openShop, closeShop, settings: () => openSettings(showMenu), showPause, failChapter, setHardcore: v => { hardcore = v; } },
  makeCat, makeBolt, makeDoge, makeRobotDog, animateBolt, TYPES, OUTFITS, T, CHAPTERS, ENDING, HIDEOUT, ACTIONS, get lang() { return lang; }, set lang(v) { lang = v; },     // for making pictures of the characters
  get gpu() { return { ...renderer.info.memory }; },
  settings, toggleMap, get music() { return { song: songName, step: musicStep, audio: actx?.state, volume: musicGain?.gain.value }; },
};

applyQuality();
buildLevel(0);
updateCamera(0, true);
// the page's own texts, its title and its language
document.documentElement.lang = lang;
document.title = t('title');
document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
wearOutfit(shop.wearing);
showMenu();
frame();
// done loading: fill the bar and fade the loading screen away
window.gameReady = true;
$('loadFill').style.width = '100%';
$('loadText').textContent = '100%';
setTimeout(() => { $('loading').style.opacity = 0; setTimeout(() => $('loading').remove(), 500); }, 300);
</script>
</body>
</html>
